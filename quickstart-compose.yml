# FOSSStudio in one paste.
#
#   1. Save this file as docker-compose.yml on a Linux server whose
#      DNS (your domain) points at it, with ports 80/443 (TCP) and
#      3478 + 40000-40100 + 49160-49200 (UDP) open.
#   2. Fill in the five values just below. Every one of them is a
#      stand-in: none will work as it is.
#   3. Turn HTTPS on: see the note above the caddy service.
#   4. docker compose up -d
#
# That's the whole install: the app image builds straight from GitHub,
# the web pages are inside it, and your studio is at https://<your
# domain>. Sign in with username "admin" and the password below, then
# change it in the dashboard.

x-config: &config
  DOMAIN: studio.your-domain.com                # your public address
  PUBLIC_IP: "your-servers-public-ip"           # curl -4 https://api.ipify.org
  HOST_PASSWORD: change-me-to-something-long    # the first "admin" login
  SESSION_SECRET: also-change-me-to-random      # openssl rand -hex 32
  TURN_SECRET: and-change-me-to-random-too      # openssl rand -hex 32
  HTTP_PORT: "3000"

services:
  app:
    build:
      context: https://github.com/lightmorphic/fossstudio.git
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Host networking: the media engine hands out many UDP ports and
    # needs real client addresses. The app itself binds to 127.0.0.1.
    network_mode: host
    environment:
      <<: *config
    volumes:
      - fossstudio_data:/data

  # ---------------------------------------------------------------------
  # HTTPS. Most people want this. To switch it on, delete the "# " from
  # the caddy: block below, and at the foot of the file from the two
  # caddy volumes and the whole configs: block. Leave the hashes on these
  # sentences; they are only notes.
  #
  # Caddy fetches and renews your certificate and serves the studio on
  # ports 80 and 443. Without HTTPS there is no studio at all - browsers
  # refuse camera and microphone access on a plain-http page, and the
  # session cookie is Secure-only, so nobody can even log in.
  #
  # The one reason to leave it commented out: this machine already runs
  # nginx, Apache or another proxy, which already holds ports 80 and 443.
  # Then leave the hashes where they are, keep your own proxy terminating
  # TLS, and point it at 127.0.0.1:3000 - the README's "Bring your own
  # reverse proxy" section has a working nginx block.
  # ---------------------------------------------------------------------
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     <<: *config
  #   configs:
  #     - source: caddyfile
  #       target: /etc/caddy/Caddyfile
  #   volumes:
  #     - caddy_data:/data
  #     - caddy_config:/config

  coturn:
    image: coturn/coturn:4-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      <<: *config
    # sh -c so the values come from the container's own environment
    # (this file has no .env for compose-time substitution)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        turnserver
        --realm="$$DOMAIN"
        --use-auth-secret
        --static-auth-secret="$$TURN_SECRET"
        --listening-port=3478
        --min-port=49160 --max-port=49200
        --no-cli
        --no-multicast-peers

volumes:
  fossstudio_data:
  # HTTPS: these two go with the caddy: block above
  # caddy_data:
  # caddy_config:

