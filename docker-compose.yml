services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      WEB_DIR: /app/web
    # Bridge networking with every port published one-to-one: the host
    # port and the container port are the same number, because the media
    # engine tells each guest which port to send audio and video to, and
    # a number that means something else outside the container is a room
    # that opens and stays silent. The media range is four ports wide -
    # mediasoup multiplexes every transport over them, see
    # server/src/media.js - so this publishes about forty ports rather
    # than a hundred and forty. APP_BIND decides who may reach the web
    # port: left alone, anything that can route here; set it to
    # 127.0.0.1 when your own proxy on this host is the only thing that
    # should.
    ports:
      - "${APP_BIND:-0.0.0.0}:${HTTP_PORT:-3000}:${HTTP_PORT:-3000}"
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40003}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40003}/udp"
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40003}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40003}/tcp"
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ./web:/app/web:ro

  # ---------------------------------------------------------------------
  # HTTPS. Most people want this. To switch it on, delete the "# " from
  # the caddy: block below and from the volumes: block at the foot of the
  # file. Leave the hashes on these sentences; they are only notes.
  #
  # Caddy fetches and renews your certificate and serves the studio on
  # ports 80 and 443. Without HTTPS there is no studio at all - browsers
  # refuse camera and microphone access on a plain-http page, and the
  # session cookie is Secure-only, so nobody can even log in.
  #
  # With Caddy on, set APP_BIND=127.0.0.1 in .env: Caddy reaches the app
  # by its service name on the compose network, so the web port has no
  # reason to leave this machine.
  #
  # The one reason to leave it commented out: this machine already runs
  # nginx, Apache or another proxy, which already holds ports 80 and 443.
  # Then leave the hashes where they are, keep your own proxy terminating
  # TLS, and point it at 127.0.0.1:${HTTP_PORT} - the README's "Bring your
  # own reverse proxy" section has a working nginx block.
  # ---------------------------------------------------------------------
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   env_file: .env
  #   # Caddy's needs are small and predictable; a cap means a leak here
  #   # can never starve the app mid-show
  #   mem_limit: 256m
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ${CADDY_SITES_PATH:-./caddy-sites}:/etc/caddy/sites:ro
  #     # Static web roots for those extra sites (see CADDY_WWW_PATH in
  #     # .env.example): a site file serves files with root * /srv/www/<name>.
  #     # The default empty folder is a no-op, like the sites folder above.
  #     - ${CADDY_WWW_PATH:-./caddy-www}:/srv/www:ro
  #     - caddy_data:/data
  #     - caddy_config:/config

  coturn:
    image: coturn/coturn:4-alpine
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49189}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49189}/udp"
    # --external-ip is what a bridged relay needs: coturn can see only
    # the container's own address, and would otherwise offer guests a
    # relay at an address that reaches nobody.
    command: >
      --realm=${DOMAIN}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --listening-port=3478
      --min-port=${TURN_MIN_PORT:-49160} --max-port=${TURN_MAX_PORT:-49189}
      --external-ip=${PUBLIC_IP}
      --no-multicast-peers

# volumes:
#   caddy_data:
#   caddy_config:
