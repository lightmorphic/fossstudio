services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Host networking: the media engine hands out many UDP ports (40000-40100)
    # and needs to see real client addresses; mapping them one-by-one is slower
    # and error-prone. The app itself binds only to 127.0.0.1.
    network_mode: host
    env_file: .env
    environment:
      DATA_DIR: /data
      WEB_DIR: /app/web
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ./web:/app/web:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    # Caddy's needs are small and predictable; a cap means a leak here
    # can never starve the app mid-show
    mem_limit: 256m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Read-only view of the app's data so Caddy can serve the live
      # HLS files straight from disk (see hls_offload in the Caddyfile)
      # instead of proxying every viewer's per-second fetches through
      # the app process. Mounted whole (not data/live alone) so Docker
      # never pre-creates a root-owned subfolder inside the app's data.
      - ${DATA_PATH:-./data}:/srv/appdata:ro
      - ${CADDY_SITES_PATH:-./caddy-sites}:/etc/caddy/sites:ro
      # Static web roots for those extra sites (see CADDY_WWW_PATH in
      # .env.example): a site file serves files with root * /srv/www/<name>.
      # The default empty folder is a no-op, like the sites folder above.
      - ${CADDY_WWW_PATH:-./caddy-www}:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    mem_limit: 256m
    command: >
      --realm=${DOMAIN}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --no-cli
      --no-multicast-peers

volumes:
  caddy_data:
  caddy_config:
