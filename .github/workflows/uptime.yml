# Uptime check for the project's own demo instance: every 15 minutes
# GitHub's runners hit its health endpoint and email the maintainer if it
# does not answer. Needs repo secrets SMTP_HOST, SMTP_PORT, SMTP_USER,
# SMTP_PASS and ALERT_EMAIL, so it only runs on the upstream repository.
# A fork inherits the file but not the job.
#
# This watches our instance, not yours. If you want the same thing for
# your own studio, fork it, change the URL and the repository check, and
# set your own secrets.
name: uptime
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    if: github.repository == 'lightmorphic/fossstudio'
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        id: health
        run: |
          if curl -fsS --max-time 20 https://app.fossstudio.org/healthz | grep -q '"ok":true'; then
            echo "up=yes" >> "$GITHUB_OUTPUT"
          else
            echo "up=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Email alert if down
        if: steps.health.outputs.up == 'no'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: FOSSStudio uptime <${{ secrets.SMTP_USER }}>
          to: ${{ secrets.ALERT_EMAIL }}
          subject: "FOSSStudio is DOWN"
          body: |
            The uptime check couldn't reach https://app.fossstudio.org/healthz just now.

            See docs/runbook.md, "If the site is down".
      - name: Fail the run if down (so it shows red)
        if: steps.health.outputs.up == 'no'
        run: exit 1
